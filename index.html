    <!-- Canonical guard: se servito da *.lovable.app, marca noindex e canonical verso www.emeraldress.com -->
    <script>
      (function () {
        try {
          var h = window.location.hostname;
          if (h.indexOf('lovable.app') !== -1 || h.indexOf('lovableproject.com') !== -1) {
            var m = document.createElement('meta');
            m.name = 'robots';
            m.content = 'noindex, nofollow';
            document.head.appendChild(m);
            // Sovrascrive canonical
            var existing = document.querySelector('link[rel="canonical"]');
            if (existing) existing.setAttribute('href', 'https://www.emeraldress.com' + window.location.pathname);
          }
        } catch (e) {}
      })();
    </script>
